# Gradle 버전 카탈로그. build.gradle.kts 는 의존성·플러그인 좌표를 전부 여기서 `libs.xxx` 로 가져온다.
#
# Demo 정책 — 신규 버전 선체험과 변화점 발견이 목적이라 사전 릴리스(M/RC/Beta/Alpha/Preview)를 허용하고 우선한다.
#  versionCatalogUpdate 는 LATEST 선택기, dependencyUpdates 는 rejectPreReleases = false 로 사전 릴리스까지 후보로 본다.
#  Spring Boot 플러그인·Kotlin·Gradle wrapper 는 Demo 리포 공통값을 쓴다.
#
# 라이브러리 항목은 두 종류다. 섞으면 의도가 조용히 바뀌므로 추가할 때 어느 쪽인지 먼저 판단한다.
#  - 버전 없는 항목 `{ module = "..." }` — Spring Boot BOM 이 정하는 것(spring-boot-starter-*, aspectjweaver,
#    jackson-module-kotlin, kotlin-reflect, kotlinx-coroutines-*).
#    kotlin-reflect 는 Spring Boot 플러그인이 BOM 의 kotlin.version 을 적용된 Kotlin 플러그인 버전으로 맞춘 값을 받는다.
#    Boot 플러그인을 사전 릴리스 포함 최신으로 올리면 이 항목들도 그 BOM 이 고른 버전을 따라간다.
#  - 버전 있는 항목 — BOM 이 모르는 것, 그리고 BOM 이 관리하지만 BOM 보다 앞서 체험하려고 원래부터 버전을 명시한 것(r2dbc-mysql).
#    직접 적은 버전은 BOM 을 이긴다. `./gradlew versionCatalogUpdate` 는 이쪽만 사전 릴리스 포함 최신으로 올리고, 버전 없는 항목은 건너뛴다.
#    BOM 관리 좌표에 버전을 새로 적는 것은 BOM 보다 앞서 가겠다는 결정이다. 그 의도가 없으면 버전 없이 넣는다.
#
# 최신에서 깨지고 고칠 수 없는 좌표는 동작하는 가장 최신 버전으로 내리고 `# @pin` 을 붙인다. 사유는 build.gradle.kts 주석에 둔다.
# versionCatalogUpdate 가 이 파일을 다시 쓸 때 항목 옆 주석은 사라질 수 있다. 남겨야 하는 설명은
# build.gradle.kts 에 두고, 여기서는 `@pin`(버전 고정) / `@keep`(미사용 항목 유지) 애노테이션만 쓴다.
[versions]
kotlin = "2.4.20"
sentry = "8.56.0"

[libraries]
aspectjweaver = { module = "org.aspectj:aspectjweaver" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
java-jwt = "com.auth0:java-jwt:4.6.1"
kotlin-logging-jvm = "io.github.oshai:kotlin-logging-jvm:8.0.4"
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor" }
r2dbc-mysql = "io.asyncer:r2dbc-mysql:1.4.3"
sentry-logback = { module = "io.sentry:sentry-logback", version.ref = "sentry" }
sentry-spring-boot4 = { module = "io.sentry:sentry-spring-boot-4", version.ref = "sentry" }
spring-boot-starter-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
springdoc-openapi-starter-webflux-ui = "org.springdoc:springdoc-openapi-starter-webflux-ui:3.1.1"

[plugins]
ben-manes-versions = "io.github.ben-manes.versions:0.62.0"
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spotless = "com.diffplug.spotless:8.10.2"
spring-boot = "org.springframework.boot:4.2.0-M1"
spring-dependency-management = "io.spring.dependency-management:1.1.7"
version-catalog-update = "nl.littlerobots.version-catalog-update:1.1.1"
